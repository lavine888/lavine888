<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LavineX — AI Product Builder and Quant Researcher</title>
  <desc id="desc">A dark navy editorial profile banner with ivory serif typography, gold accents, and a subtle dotted grid.</desc>

  <defs>
    <radialGradient id="ambientBlue" cx="20%" cy="8%" r="70%">
      <stop offset="0" stop-color="#192a52" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGold" cx="86%" cy="88%" r="54%">
      <stop offset="0" stop-color="#d6a85a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleSheen" x1="-360" y1="0" x2="-80" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8edf8"/>
      <stop offset="0.32" stop-color="#e8edf8"/>
      <stop offset="0.42" stop-color="#d6a85a"/>
      <stop offset="0.5" stop-color="#fffaf0"/>
      <stop offset="0.58" stop-color="#d6a85a"/>
      <stop offset="0.68" stop-color="#e8edf8"/>
      <stop offset="1" stop-color="#e8edf8"/>
      <animate attributeName="x1" values="-360;400" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-80;680" dur="5.2s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="74" height="74" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d8e0ef" fill-opacity="0.13"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#050914"/>
    <rect width="1200" height="420" fill="url(#ambientBlue)"/>
    <rect width="1200" height="420" fill="url(#ambientGold)"/>
    <rect width="1200" height="420" fill="url(#dots)"/>

    <g transform="translate(86 82)">
      <text x="0" y="78" fill="url(#titleSheen)" font-family="Georgia, Times New Roman, serif" font-size="70" font-weight="700" letter-spacing="-3.2">LavineX</text>

      <text x="0" y="158" fill="#d6a85a" font-family="Georgia, Times New Roman, serif" font-size="51" font-weight="700" letter-spacing="-2">AI Product Builder</text>
      <line x1="478" y1="116" x2="478" y2="164" stroke="#d8e0ef" stroke-opacity="0.42" stroke-width="2"/>
      <text x="0" y="220" fill="#d6a85a" font-family="Georgia, Times New Roman, serif" font-size="51" font-weight="700" letter-spacing="-2">Quant Researcher</text>
    </g>

    <line x1="86" y1="334" x2="166" y2="334" stroke="#d6a85a" stroke-width="3"/>

    <g transform="translate(790 176)" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace">
      <text x="0" y="0" fill="#d6a85a" fill-opacity="0.72" font-size="11" font-weight="700" letter-spacing="2">// OPERATING PRINCIPLE</text>
      <line x1="0" y1="18" x2="304" y2="18" stroke="#d8e0ef" stroke-opacity="0.12"/>
      <text x="0" y="52" fill="#d6a85a" fill-opacity="0.78" font-size="14">&gt;</text>
      <text x="22" y="52" fill="#a8b4c8" fill-opacity="0.78" font-size="14" letter-spacing="0.5">idea -&gt; system -&gt; feedback;</text>
      <text x="0" y="84" fill="#d6a85a" fill-opacity="0.78" font-size="14">&gt;</text>
      <text x="22" y="84" fill="#a8b4c8" fill-opacity="0.78" font-size="14" letter-spacing="0.5">data -&gt; signal -&gt; evidence;</text>
    </g>

  </g>
</svg>
