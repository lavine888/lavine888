<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Lavine Xie — AI Products and Quantitative Systems</title>
  <desc id="desc">A dark blue profile banner highlighting Lavine Xie's focus on AI products and quantitative systems.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0d1b35"/>
      <stop offset="1" stop-color="#102a3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity="0.075"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="170" cy="20" r="300" fill="url(#blueGlow)"/>
    <circle cx="1120" cy="390" r="330" fill="url(#tealGlow)"/>
    <path d="M0 10H1200" stroke="url(#accent)" stroke-width="10"/>

    <g fill="none" stroke-linecap="round">
      <path d="M710 337C785 285 816 340 878 266S1010 202 1165 122" stroke="#60a5fa" stroke-opacity="0.18" stroke-width="2"/>
      <path d="M710 360C790 320 845 380 910 305S1045 250 1180 180" stroke="#2dd4bf" stroke-opacity="0.16" stroke-width="2"/>
      <circle cx="878" cy="266" r="5" fill="#60a5fa" stroke="none"/>
      <circle cx="910" cy="305" r="5" fill="#2dd4bf" stroke="none"/>
      <circle cx="1085" cy="167" r="5" fill="#818cf8" stroke="none"/>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="68" y="67" fill="#93c5fd" font-size="14" font-weight="700" letter-spacing="2.8">LAVINE / BUILDER PROFILE</text>
      <text x="68" y="161" fill="#f8fafc" font-size="66" font-weight="750" letter-spacing="-2">Lavine Xie</text>
      <rect x="68" y="188" width="90" height="4" rx="2" fill="url(#accent)"/>
      <text x="68" y="238" fill="#bfdbfe" font-size="22" font-weight="700" letter-spacing="2.2">AI PRODUCTS</text>
      <text x="256" y="238" fill="#64748b" font-size="22" font-weight="400">×</text>
      <text x="291" y="238" fill="#99f6e4" font-size="22" font-weight="700" letter-spacing="2.2">QUANTITATIVE SYSTEMS</text>
      <text x="68" y="290" fill="#cbd5e1" font-size="19">From ambiguous ideas to testable products, models, and working demos.</text>
      <text x="68" y="354" fill="#64748b" font-size="13" font-weight="700" letter-spacing="2.2">BUILD  /  TEST  /  ITERATE</text>

      <g transform="translate(850 77)" filter="url(#shadow)">
        <rect width="282" height="110" rx="20" fill="#0f2240" stroke="#60a5fa" stroke-opacity="0.34"/>
        <circle cx="31" cy="31" r="7" fill="#60a5fa"/>
        <text x="51" y="36" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="2">FOCUS 01</text>
        <text x="28" y="78" fill="#f8fafc" font-size="24" font-weight="700">AI Products</text>
      </g>

      <g transform="translate(804 215)" filter="url(#shadow)">
        <rect width="328" height="110" rx="20" fill="#0e2936" stroke="#2dd4bf" stroke-opacity="0.34"/>
        <circle cx="31" cy="31" r="7" fill="#2dd4bf"/>
        <text x="51" y="36" fill="#99f6e4" font-size="12" font-weight="700" letter-spacing="2">FOCUS 02</text>
        <text x="28" y="78" fill="#f8fafc" font-size="24" font-weight="700">Quantitative Systems</text>
      </g>
    </g>
  </g>
</svg>
