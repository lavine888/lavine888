<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">LavineX — AI Product Builder and Quant Researcher</title>
  <desc id="desc">A dark navy editorial profile banner with ivory serif typography, gold accents, and a subtle dotted grid.</desc>

  <defs>
    <radialGradient id="ambientBlue" cx="20%" cy="8%" r="70%">
      <stop offset="0" stop-color="#192a52" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientGold" cx="86%" cy="88%" r="54%">
      <stop offset="0" stop-color="#d6a85a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#050914" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="74" height="74" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d8e0ef" fill-opacity="0.13"/>
    </pattern>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#00040c" flood-opacity="0.48"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#050914"/>
    <rect width="1200" height="420" fill="url(#ambientBlue)"/>
    <rect width="1200" height="420" fill="url(#ambientGold)"/>
    <rect width="1200" height="420" fill="url(#dots)"/>

    <g transform="translate(92 130)" filter="url(#softShadow)">
      <circle cx="78" cy="78" r="78" fill="#0a1223" stroke="#d6a85a" stroke-width="2"/>
      <circle cx="78" cy="78" r="68" fill="none" stroke="#d6a85a" stroke-opacity="0.2"/>
      <text x="78" y="94" text-anchor="middle" fill="#e8edf8" font-family="Georgia, Times New Roman, serif" font-size="52" font-weight="700" letter-spacing="-3">LX</text>
      <circle cx="130" cy="25" r="5" fill="#d6a85a"/>
    </g>

    <g transform="translate(272 82)">
      <text x="0" y="78" fill="#e8edf8" font-family="Georgia, Times New Roman, serif" font-size="70" font-weight="700" letter-spacing="-3.2">LavineX</text>

      <text x="0" y="158" fill="#d6a85a" font-family="Georgia, Times New Roman, serif" font-size="51" font-weight="700" letter-spacing="-2">AI Product Builder</text>
      <line x1="478" y1="116" x2="478" y2="164" stroke="#d8e0ef" stroke-opacity="0.22" stroke-width="2"/>
      <text x="0" y="220" fill="#d6a85a" font-family="Georgia, Times New Roman, serif" font-size="51" font-weight="700" letter-spacing="-2">Quant Researcher</text>

      <line x1="0" y1="252" x2="80" y2="252" stroke="#d6a85a" stroke-width="3"/>
      <text x="0" y="294" fill="#a8b4c8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="0.1">Turning ambitious ideas into working systems — from zero to demo, from signal to evidence.</text>
    </g>

  </g>
</svg>
